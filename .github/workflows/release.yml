name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Package zip
        shell: pwsh
        run: |
          Compress-Archive -Path "install.ps1","uninstall.ps1","一键部署.bat","一键卸载.bat","README.md","files" `
            -DestinationPath "WWMI-DLSS5-Deploy.zip" -Force

      - name: Build exe (PS2EXE)
        shell: pwsh
        continue-on-error: true
        run: |
          Install-Module ps2exe -Force -Scope CurrentUser -AllowClobber
          Import-Module ps2exe
          ps2exe -inputFile "install.ps1"   -outputFile "一键部署.exe" -title "XXMI+ReShade+DLSS5 部署" -requireAdmin -UNICODEEncoding -x64
          ps2exe -inputFile "uninstall.ps1" -outputFile "一键卸载.exe" -title "XXMI+ReShade+DLSS5 卸载" -requireAdmin -UNICODEEncoding -x64
          Get-ChildItem *.exe -ErrorAction SilentlyContinue | ForEach-Object { "built: " + $_.Name + "  " + $_.Length + " bytes" }

      - name: Attach exe to zip if built
        shell: pwsh
        continue-on-error: true
        run: |
          if (Test-Path "一键部署.exe") {
            Compress-Archive -Path "一键部署.exe","一键卸载.exe" -DestinationPath "WWMI-DLSS5-Deploy-exe.zip" -Force
            Get-Item "WWMI-DLSS5-Deploy-exe.zip" | ForEach-Object { "exe zip: " + $_.Length + " bytes" }
          } else {
            "PS2EXE 未产出 exe，跳过 exe 包"
          }

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          fail_on_unmatched_files: false
          files: |
            WWMI-DLSS5-Deploy.zip
            WWMI-DLSS5-Deploy-exe.zip
          body: |
            鸣潮 XXMI + ReShade + DLSS5 一键部署包。

            - `WWMI-DLSS5-Deploy.zip`：脚本版，解压后右键「一键部署.bat」以管理员运行
            - `WWMI-DLSS5-Deploy-exe.zip`：exe 版，双击自动申请管理员权限

            部署后用官方启动器以 DX11 启动游戏；卸载运行「一键卸载」。详见 README.md。
